name: Lean 4 Proof Verification & Blueprint Graph

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-kernel:
    name: Lean kernel, axioms, and blueprint names
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Mathlib cache
        run: lake exe cache get || true

      - name: Lake build
        run: lake build

      - name: Axiom audit
        run: lake env lean --run verifier/backends/formal/audit_axioms.lean

      - name: Check blueprint Lean names
        run: python3 tests/regression/check_lean_decls.py

      - name: Assurance levels (catalog)
        run: python3 tests/regression/check_catalog.py

      - name: Check formal/core layering
        run: python3 tests/regression/check_layers.py

      - name: Check that every citation resolves
        run: python3 tests/regression/check_references.py

      - name: Check the specs registries and the coverage matrix
        run: python3 tests/regression/check_specs.py

      - name: Check that each claim card states the Spec of its Sound theorems
        run: python3 tests/regression/check_spec_shapes.py

      - name: Fail if committed graph is stale
        run: python3 blueprint/export_blueprint.py --check

      - name: Regression and integration tests
        run: |
          python3 -m unittest discover -s tests/regression -p 'test_*.py'
          python3 -m unittest discover -s tests/integration -p 'test_*.py'
          lake build audit_axioms
          for f in tests/regression/lean/*.lean; do echo "== $f"; lake env lean "$f"; done

      - name: "Conformance: ot verify (1 accept, 14 rejects)"
        run: python3 tests/conformance/heldout_verify.py

      - name: "Conformance: demo (1 accept, 4 rejects)"
        run: tests/conformance/certified_accuracy.sh

      - name: "Conformance: fast checks (MLP, pool, trees), kernel and compiled lanes agree"
        run: |
          lake build ot_kernel
          python3 tests/conformance/fast_check.py
          python3 tests/conformance/pool_check_lanes.py
          python3 tests/conformance/pool_sample_lanes.py
          python3 tests/conformance/tree_check.py
          lake build ot_check
          python3 tests/conformance/tree_verify.py

      - name: "Conformance: pool-rate and judged-rate certificates (recorded drand rounds)"
        run: |
          lake build ot_check
          python3 -m pip install py_arkworks_bls12381 || python3 -m pip install py_ecc
          python3 tests/conformance/pool_rate_verify.py
          python3 tests/conformance/judged_rate_verify.py
          python3 tests/conformance/rate_gap_verify.py

      - name: Upload blueprint graph
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-data
          path: blueprint/blueprint.json
          retention-days: 14
