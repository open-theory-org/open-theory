id = "heldout-binomial-bound"
name = "Exact binomial (Clopper–Pearson) held-out error bound"
level = "verified"
mode = "verified-checker"
kind = "statistical"
summary = "Untrusted bisection finds the tightest bound; the kernel checks the integer tail inequality; a proved theorem turns it into a population bound."
implementation = ["methods/statistical/binomial_bound.py", "methods/statistical/heldout_certificate.py"]
assumptions = ["A1-iid", "A2-heldout-independent", "A4-labels"]
trusted = ["Lean kernel", "statement of OpenTheory.BinomialTail.testSet_bound"]
conformance = ["tests/conformance/heldout_verify.py", "tests/conformance/certified_accuracy.sh"]
references = [{ key = "clopper1934use", relation = "implements" }]

[lean]
spec = ["OpenTheory.HeldOut.Claim", "OpenTheory.BinomialTail.binomCdf", "OpenTheory.BinomialTail.tailNumerator"]
correctness = [
  "OpenTheory.HeldOut.Claim.of_tail",
  "OpenTheory.BinomialTail.testSet_bound",
  "OpenTheory.BinomialTail.count_testSet_bound",
  "OpenTheory.BinomialTail.clopperPearson",
  "OpenTheory.BinomialTail.tailNumerator_eq",
  "OpenTheory.BinomialTail.binomCdf_div_eq",
]
