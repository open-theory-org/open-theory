id = "rate-gap-certificate"
name = "Rate gap and ratio between two committed pools (fairness)"
level = "verified"
mode = "verified-checker"
kind = "statistical"
summary = "One beacon round samples two committed pools (one per group); upper bounds on the rate of a committed output and of its complement in each pool certify the gap (demographic parity difference) or the ratio (four-fifths rule)."
establishes = ["rate-gap", "rate-ratio"]
checks = ["pool-sample-packed", "pool-sample-packed-witness", "pool-sample", "pool-sample-witness", "pool", "pool-witness"]
implementation = ["methods/statistical/pool_rate_certificate.py"]
assumptions = ["A5-beacon", "A6-timestamp", "A7-issuer-identity", "A12-commitment-binding", "A10-group-membership"]
trusted = ["Lean kernel (ot_kernel; ot_check runs are labelled not verified)", "statements of OpenTheory.PoolSample.claim_of_poolSamplePacked(W), PoolSample.rateGap_of_claims, RateGap.gap_sound and RateGap.ratio_sound", "verifier beacon expansion and Merkle checks (PoolSample.Faithful, under A5 and A12), and its packing of the checked positions", "drand threshold network", "RFC 3161 authority chosen by whoever runs the verifier"]
conformance = ["tests/conformance/pool_sample_lanes.py", "tests/conformance/rate_gap_verify.py"]
references = [
  { key = "clopper1934use", relation = "implements" },
  { key = "luck2026certified", relation = "background" },
]

[lean]
check = ["OpenTheory.Checks.poolSamplePacked", "OpenTheory.Checks.poolSamplePackedW", "OpenTheory.Checks.poolSampleK", "OpenTheory.Checks.poolSampleWitnessK"]
spec = ["OpenTheory.Checks.poolSample", "OpenTheory.PoolSample.decodeDrawn", "OpenTheory.Checks.Drawn", "OpenTheory.PoolSample.Faithful", "OpenTheory.RateGap.Claim", "OpenTheory.RateGap.Params", "OpenTheory.Checks.poolCheck"]
correctness = [
  "OpenTheory.PoolSample.rateGap_of_claims",
  "OpenTheory.PoolSample.claim_of_poolSamplePacked",
  "OpenTheory.PoolSample.claim_of_poolSamplePackedW",
  "OpenTheory.PoolSample.card_counted",
  "OpenTheory.PoolSample.index_of_indicesPacked",
  "OpenTheory.PoolSample.slot_differ",
  "OpenTheory.PoolSample.slot_mul_add",
  "OpenTheory.PoolSample.rateGap_accepts",
  "OpenTheory.PoolSample.claim_of_poolSample",
  "OpenTheory.PoolSample.claim_of_poolSampleWitness",
  "OpenTheory.Checks.poolSampleK_eq",
  "OpenTheory.Checks.runPoolSample_eq",
  "OpenTheory.RateGap.interval_sound",
  "OpenTheory.RateGap.bad_frac",
  "OpenTheory.DesignSampling.seedFrac_restrict",
  "OpenTheory.PoolRate.Claim.of_poolCheck",
]
