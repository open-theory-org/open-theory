id = "linear-model-check"
name = "Robustness and monotonicity of a linear or logistic-regression model, checked by the kernel"
level = "verified"
mode = "verified-checker"
kind = "linear"
summary = "The verifier scales the model exactly (A11) and the kernel computes the least or greatest score on the box at the corner the weights' signs pick (robustness), or reads the sign of one weight (monotonicity). When every feature is bounded, robustness uses the packed check: weights and bounds as base-2^B digits, two Kronecker products, so the cost does not grow with the number of features (0.25 ms at 10 features, 0.8 ms at 1,000). Exact."
establishes = ["robust-decision", "monotone-feature"]
checks = ["linear-robust", "linear-robust-packed", "linear-monotone"]
implementation = ["methods/linear/linear_certificate.py", "verifier/core/linear.py"]
assumptions = ["A3-model-binding", "A11-model-translation"]
trusted = ["Lean kernel (ot_kernel; ot_check runs are labelled not verified)", "statements of OpenTheory.linearRobust_sound, OpenTheory.Checks.Linear.linearRobustPacked_sound and OpenTheory.linearMonotone_sound", "the request decoder OpenTheory.Checks.Linear.decRobust / decMonotone (shared by both lanes) and ot_kernel's term builder, cross-checked by `ot_kernel --show`", "the translation from the deployed model (A11), and for the packed check the verifier's packing of that model and box (checked by tests/conformance/linear_verify.py, which unpacks them)"]
conformance = ["tests/conformance/linear_verify.py"]
references = [{ key = "hosmer2013applied", relation = "background" }, { key = "harvey2009kronecker", relation = "implements" }]

[lean]
spec = ["OpenTheory.Checks.Linear.LinearModel", "OpenTheory.Checks.Linear.LinearModel.score", "OpenTheory.Checks.Linear.robust", "OpenTheory.Checks.Linear.monotone", "OpenTheory.Checks.Linear.packedModel", "OpenTheory.Checks.Linear.packedBox"]
check = ["OpenTheory.Checks.Linear.robustK", "OpenTheory.Checks.Linear.monotone", "OpenTheory.Checks.Linear.robustPackedN"]
correctness = [
  "OpenTheory.Checks.Linear.robustK_eq",
  "OpenTheory.Checks.Linear.runRobust_eq",
  "OpenTheory.Checks.Linear.robust_sound",
  "OpenTheory.Checks.Linear.monotone_sound",
  "OpenTheory.Checks.Linear.minScore_le",
  "OpenTheory.Checks.Linear.le_maxScore",
  "OpenTheory.Checks.Linear.termMin_le",
  "OpenTheory.Checks.Linear.le_termMax",
  "OpenTheory.Checks.Linear.robustPacked_sound",
  "OpenTheory.Checks.Linear.linearRobustPacked_sound",
  "OpenTheory.Checks.Linear.dotSlot_eq",
  "OpenTheory.Slots.pack_mod_pred",
]
