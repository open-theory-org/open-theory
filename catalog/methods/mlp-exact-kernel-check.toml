id = "mlp-exact-kernel-check"
name = "Exact forward pass of a quantized ReLU MLP, checked on packed integers"
level = "experimental"
kind = "neural"
summary = "The kernel checks, in about a millisecond for 50k parameters, that a ReLU network with integer weights outputs exactly Y on x. The theorem that acceptance implies this claim is not proved yet, so the result is evidence, not a guarantee."
