assumptions = ["A3-model-binding"]
trusted = ["Lean kernel", "definition OpenTheory.Checks.MLP.check, whose meaning is not yet proved"]
conformance = ["tests/conformance/fast_check.py"]
references = [{ key = "harvey2009kronecker", relation = "background" }]

